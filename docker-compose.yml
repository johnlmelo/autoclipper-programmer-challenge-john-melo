version: "3.9"

services:

  postgres:
    image: postgres:15
    container_name: autoclipper_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: renders_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: autoclipper_redis
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: autoclipper_minio
    command: server /data --console-address ":9001"
    restart: always
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: autoclipper_api
    restart: always
    depends_on:
      - postgres
      - redis
      - minio
    environment:
      PORT: 4000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: renders_db

      REDIS_HOST: redis
      REDIS_PORT: 6379

      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password
      MINIO_BUCKET: renders

    ports:
      - "4000:4000"

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: autoclipper_worker
    restart: always
    depends_on:
      - postgres
      - redis
      - minio
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: renders_db

      REDIS_HOST: redis
      REDIS_PORT: 6379

      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password
      MINIO_BUCKET: renders

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: autoclipper_frontend
    restart: always
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  minio_data: